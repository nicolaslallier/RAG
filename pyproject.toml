[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "psycopg[binary]>=3.2",
  "httpx",
  "pyyaml",
  "boto3",
  "tree-sitter-language-pack>=1.25.2",
  "graphifyy==0.9.114",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["vivant: appelle le vrai LiteLLM"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
