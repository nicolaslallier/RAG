[project]
name = "rag"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic-settings",
  "psycopg[binary]>=3.2",
  "httpx",
  "pyyaml",
  "boto3",
  "tree-sitter-language-pack>=1.25.2",
  "graphifyy==0.9.114",
  "mcp>=1.20,<2",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.34",
]

[dependency-groups]
dev = ["pytest", "ruff"]
rerank = ["sentence-transformers", "torch"]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
  "vivant: appelle le vrai LiteLLM",
  "lent: télécharge un modèle (hors CI)",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
