# Pile Portainer « rag » (environnement Mac-book : Colima du MacBook, Mac 192.168.2.40, VM sans IP propre) : API, indexeur
# Postgres dédié et son exporter. Deux ports publiés, relayés par Colima sur le MacBook : 8000 (`rag`)
# et 9187 (`rag-postgres-exporter`, métriques lues par le Prometheus de l'Infra).
# Envoyée comme texte par scripts/portainer-stack.sh ; les ${…} viennent de OpenBao (scripts/vault-render-env.sh).
x-rag: &rag
  image: ghcr.io/nicolaslallier/rag:${IMAGE_TAG:?}
  environment: &env
    RAG_DATABASE_URL: postgresql://rag:${RAG_DB_PASSWORD:?}@rag-postgres:5432/rag
    RAG_LITELLM_URL: https://litellm.infra.famillelallier.net
    RAG_LITELLM_CA: /etc/rag/infra-ca.crt
    RAG_LITELLM_CLE: ${RAG_LITELLM_CLE:?}
    RAG_JETON: ${RAG_JETON:?}
    RAG_JETON_PRIVE: ${RAG_JETON_PRIVE:-}
    RAG_JETON_REINDEXER: ${RAG_JETON_REINDEXER:?}
    RAG_GITHUB_JETON: ${RAG_GITHUB_JETON:-}
    RAG_CLE_SECRETS: ${RAG_CLE_SECRETS:-}
    RAG_S3_ENDPOINT: https://s3.infra.famillelallier.net
    AWS_CA_BUNDLE: /etc/rag/infra-ca.crt
    RAG_S3_ACCESS_KEY: rag
    RAG_S3_SECRET_KEY: ${RAG_S3_SECRET_KEY:?}
    RAG_MONITORING_DB_PASSWORD: ${RAG_MONITORING_DB_PASSWORD:?}   # `rag migrer` crée/aligne le rôle monitoring
    RAG_COFFRE_BUCKET: obsidian
    RAG_COFFRE_PREFIXE: ${RAG_COFFRE_PREFIXE:-}
    RAG_DONNEES_DIR: /donnees
    RAG_CONFIG: /app/config/rag.yaml
    RAG_SOURCES_AMORCE: /app/config/sources-maison.yaml
  volumes: [rag-donnees:/donnees]
  depends_on:
    rag-postgres: {condition: service_healthy}
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  restart: unless-stopped
  # La VM Colima du MacBook ne résout pas le DNS de la maison : vhosts de l'Infra en dur.
  extra_hosts:
    - "litellm.infra.famillelallier.net:192.168.2.10"
    - "s3.infra.famillelallier.net:192.168.2.10"

services:
  rag:
    <<: *rag
    ports: ["8000:8000"]   # Colima du MacBook sans IP propre : le port passe par le Mac (192.168.2.40), toutes ses interfaces
    mem_limit: 4g            # reranker (568M de paramètres) + torch CPU
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s     # premier démarrage : téléchargement du reranker
  rag-indexeur:
    <<: *rag
    command: ["sh", "-c", "rag migrer && exec rag travailleur"]
    mem_limit: 2g

  rag-postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    environment:
      POSTGRES_USER: rag
      POSTGRES_DB: rag
      POSTGRES_PASSWORD: ${RAG_DB_PASSWORD:?}   # lu à la création du volume seulement
    volumes: [rag-pgdata:/var/lib/postgresql]
    shm_size: 256m           # construction parallèle de l'index HNSW
    mem_limit: 1g
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U rag -d rag"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Métriques de rag-postgres pour le Prometheus de l'Infra (job `postgres`, cluster="rag").
  # Même image et mêmes flags que l'Infra (docker-compose.postgres.yml) : les garder en phase.
  # Rôle `monitoring` (pg_monitor), créé par `rag migrer` ; jamais le rôle `rag` (superuser).
  rag-postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1@sha256:38606faa38c54787525fb0ff2fd6b41b4cfb75d455c1df294927c5f611699b17
    command:
      - --collector.postmaster
      - --collector.stat_checkpointer
      - --collector.database_wraparound
    environment:
      DATA_SOURCE_URI: rag-postgres:5432/rag?sslmode=disable
      DATA_SOURCE_USER: monitoring
      DATA_SOURCE_PASS: ${RAG_MONITORING_DB_PASSWORD:?}
    ports: ["9187:9187"]   # sans authentification, lu par Prometheus (192.168.2.10) ; passe par le Mac, toutes ses interfaces
    depends_on:
      rag-postgres: {condition: service_healthy}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m          # 80 Mo mesurés sur l'exporter de l'Infra
    restart: unless-stopped

volumes:
  rag-donnees:
  rag-pgdata:
